<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 60" width="400" height="60" style="background-color: #00000000;">
  <style>
@font-face {
  font-family: 'Cascadia Code';
  font-style: normal;
  font-weight: 700;
  src: url(data:font/truetype;base64,) format('truetype');
}
text {
  font-family: 'Cascadia Code', monospace;
  font-weight: 700;
  font-size: 20px;
  fill: #C98A4A;
}
  </style>
  <defs>
    <clipPath id="clip1">
      <rect x="0" y="0" width="0" height="60">
        <animate id="t1" attributeName="width" from="0" to="400" begin="0s" dur="4000ms" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="clip2">
      <rect x="0" y="0" width="0" height="60">
        <animate id="t2" attributeName="width" from="0" to="400" begin="t1.end" dur="6300ms" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
  <text x="0" y="25" clip-path="url(#clip1)">Hi, I'm Chloe.</text>
  <text x="0" y="50" clip-path="url(#clip2)">A freshman CS student.</text>
</svg>
